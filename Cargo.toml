[package]
name = "rust-pds-cloudflare"
version = "0.1.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
description = "Template: deploy a Rust AT-Protocol PDS (stelyph-core) to Cloudflare Workers."
repository = "https://github.com/Spirallex/rust-pds-cloudflare"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# stelyph-core is a workspace member of the public github.com/Spirallex/rust-pds
# monorepo; Cargo finds it by `package` name. Pinned to a rev for reproducible
# builds — bump when you re-sync src/ with ./sync.sh.
#
# no-default-features drops the SQLite backend (can't link on wasm32). lean-auth
# drops argon2id from 19 MiB to 4 MiB (the isolate is single-threaded, so the KDF
# runs inline).
stelyph-core = { git = "https://github.com/Spirallex/rust-pds", package = "stelyph-core", rev = "6d58101aaa05311ab603662a4c146d37e64d0129", default-features = false, features = ["lean-auth"] }

worker = { version = "0.8", features = ["http", "d1"] }
worker-macros = { version = "0.8", features = ["http"] }
http = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

async-trait = "0.1"
anyhow = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
cid = "0.11"
data-encoding = "2"
atrium-crypto = "0.1.3"
atrium-api = "0.25.8"
rand = "0.8"
tokio = { version = "1", features = ["sync"] }

[profile.release]
# Workers bundles are size-capped. opt-level="s" + fat LTO + one codegen unit
# keeps the .wasm small; panic="abort" drops unwinding tables (dead weight in an
# isolate that can't catch a panic).
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
