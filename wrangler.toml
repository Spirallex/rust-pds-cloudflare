# Cloudflare Worker config for a Rust AT-Protocol PDS (stelyph-core based).
# Placeholder fields are filled in by ./setup.sh — do not deploy until
# they are replaced.
name = "__WORKER_NAME__"
main = "build/worker/shim.mjs"
compatibility_date = "2026-07-01"
account_id = "__CF_ACCOUNT_ID__"

# Publish on <name>.workers.dev for a reachable smoke-test URL. Custom routes,
# DNS, and the TLS certificate are intentionally NOT declared here — manage them
# with your infra-as-code (Pulumi/Terraform) or the dashboard, so `wrangler
# deploy` and your IaC don't fight over the same resource.
workers_dev = true

[build]
# worker-build must match the `worker` crate's wasm-bindgen requirement — pin it
# to the crate's major so a bindgen schema-version mismatch can't happen.
command = "cargo install -q worker-build --version ^0.8 && worker-build --release"

# --- Durable Objects -------------------------------------------------------
# PDS: one instance per hostname, the single writer for that repo (keeps `seq`
#      monotonic, root pointer safe to CAS).
# REGISTRY: one instance for the whole deployment — claimed labels + invite codes.
# SEQUENCER: one instance for the whole deployment — the firehose merge point.
[durable_objects]
bindings = [
  { name = "PDS", class_name = "PdsDurableObject" },
  { name = "REGISTRY", class_name = "RegistryDurableObject" },
  { name = "SEQUENCER", class_name = "SequencerDurableObject" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PdsDurableObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["RegistryDurableObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["SequencerDurableObject"]

# --- R2 --------------------------------------------------------------------
# Blobs (avatars, images, video) and cold CAR chunks: large, immutable,
# content-addressed. Create the bucket before first deploy:
#   wrangler r2 bucket create __R2_BUCKET__
[[r2_buckets]]
binding = "BLOBS"
bucket_name = "__R2_BUCKET__"

[vars]
# The suffix new handles are created under, advertised as availableUserDomains by
# com.atproto.server.describeServer.
PDS_ZONE_SUFFIX = "__PDS_ZONE_SUFFIX__"
# Where the registration page and createAccount are served.
PDS_SIGNUP_HOST = "__PDS_SIGNUP_HOST__"
# "true" = anyone reaching the signup host may create an account with no invite.
# Defaults to false in this template; flip deliberately.
PDS_OPEN_REGISTRATION = "false"

# Secrets (set with `wrangler secret put`, never in this file):
#   PDS_JWT_SECRET       HMAC secret for session JWTs; also the DPoP nonce seed.
#   PDS_KEY_PASSPHRASE   argon2id passphrase wrapping every signing key at rest.

[dev]
port = 8787

[observability]
enabled = true
